<div class="col-6 col-md-4 col-lg-3" data-tile>
  <div class="fh-tile">
    <img src="{{ image.image.url }}" alt="รูปทรัพย์" loading="lazy">
    {% if image.is_cover %}<span class="fh-badge gold fh-tile-badge">หน้าปก</span>{% endif %}
    <div class="fh-tile-actions">
      {% if cover_url_name and not image.is_cover %}
      <form method="post" action="{% url cover_url_name image.pk %}">{% csrf_token %}<button class="btn btn-sm btn-outline btn-icon" type="submit" aria-label="ตั้งเป็นหน้าปก" title="ตั้งเป็นหน้าปก"><i class="fa-regular fa-star"></i></button></form>
      {% endif %}
      <button class="btn btn-sm btn-danger-soft btn-icon" type="button" data-ajax-post="{% url delete_url_name image.pk %}" data-target="closest:[data-tile]" aria-label="ลบรูป" title="ลบรูป"><i class="fa-regular fa-trash-can"></i></button>
    </div>
  </div>
</div>
